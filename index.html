<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>City Builder - Text Adventure</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Choice-driven text-based city builder game">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <button id="restart-game-btn" title="Начать заново">🔄</button>
    <div id="game-container">
        <canvas id="bg-canvas"></canvas>
        <div id="ui-overlay">
            <header>
                <h1>ГОРОД <span id="city-name">НОВЫЙ РАССВЕТ</span></h1>
                <div id="stats-bar">
                    <div class="stat"><span class="stat-label">День:</span> <span id="day-counter">1</span></div>
                    <div class="stat"><span class="stat-label">Население:</span> <span id="population">10</span></div>
                    <div class="stat"><span class="stat-label">Золото:</span> <span id="gold">100</span></div>
                    <div class="stat"><span class="stat-label">Еда:</span> <span id="food">50</span></div>
                    <div class="stat"><span class="stat-label">Древесина:</span> <span id="wood">30</span></div>
                    <div class="stat"><span class="stat-label">Камень:</span> <span id="stone">20</span></div>
                </div>
            </header>
            
            <main id="story-panel">
                <div id="history-panel">
                    <ul id="history-list">
                        <li>Основано поселение "Новый Рассвет"</li>
                    </ul>
                </div>
            </main>
            
            <div id="choices-panel"></div>
        </div>
    </div>
    
    <div id="notification" class="hidden"></div>
    <div id="game-over-screen" class="hidden">
        <div class="game-over-content">
            <h2>ИГРА ОКОНЧЕНА</h2>
            <p id="game-over-message"></p>
            <button id="restart-btn">НАЧАТЬ ЗАНОВО</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/gameState.js"></script>
    <script src="js/system.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
