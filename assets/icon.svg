<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <rect width="512" height="512" rx="100" fill="url(#grad2)"/>
  
  <!-- City silhouette -->
  <g transform="translate(256, 256)">
    <!-- Buildings -->
    <rect x="-60" y="-80" width="40" height="80" fill="#f5deb3" rx="2" ry="2"/>
    <rect x="-20" y="-100" width="50" height="100" fill="#cd853f" rx="2" ry="2"/>
    <rect x="30" y="-70" width="35" height="70" fill="#a0522d" rx="2" ry="2"/>
    
    <!-- Roofs -->
    <polygon points="-80,-80 -40,-80 -60,-100" fill="#8b4513"/>
    <polygon points="-35,-100 15,-100 -10,-120" fill="#654321"/>
    <polygon points="15,-70 65,-70 40,-85" fill="#4a4a4a"/>
    
    <!-- Windows -->
    <rect x="-50" y="-60" width="8" height="8" fill="#ffd700" rx="1"/>
    <rect x="-35" y="-60" width="8" height="8" fill="#ffd700" rx="1"/>
    <rect x="-50" y="-40" width="8" height="8" fill="#ffd700" rx="1"/>
    <rect x="-35" y="-40" width="8" height="8" fill="#ffd700" rx="1"/>
    
    <rect x="-10" y="-80" width="10" height="10" fill="#ffd700" rx="1"/>
    <rect x="20" y="-80" width="10" height="10" fill="#ffd700" rx="1"/>
    <rect x="-10" y="-50" width="10" height="10" fill="#ffd700" rx="1"/>
    <rect x="20" y="-50" width="10" height="10" fill="#ffd700" rx="1"/>
    
    <!-- Tower -->
    <rect x="70" y="-90" width="20" height="90" fill="#696969" rx="1"/>
    <polygon points="55,-90 95,-90 75,-110" fill="#4a4a4a"/>
    <rect x="75" y="-70" width="10" height="10" fill="#ffd700" rx="1"/>
    
    <!-- Sun -->
    <circle cx="150" cy="-150" r="25" fill="#ffd700"/>
    <circle cx="150" cy="-150" r="35" fill="none" stroke="#ffaa00" stroke-width="8" opacity="0.5"/>
    
    <!-- River -->
    <path d="M -100 120 Q 0 140 100 120 Q 150 100 200 120" stroke="#1e88e5" stroke-width="15" fill="none" stroke-linecap="round"/>
    
    <!-- Trees -->
    <rect x="-120" y="80" width="15" height="30" fill="#8b4513" rx="1"/>
    <circle cx="-112" cy="60" r="12" fill="#228b22"/>
    
    <rect x="120" y="80" width="15" height="30" fill="#8b4513" rx="1"/>
    <circle cx="128" cy="60" r="12" fill="#228b22"/>
    
    <!-- Hills -->
    <path d="M -200 100 Q -150 50 -100 100" fill="#556b2f" opacity="0.8"/>
    <path d="M 100 100 Q 150 50 200 100" fill="#556b2f" opacity="0.8"/>
  </g>
  
  <!-- Border -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#e94560" stroke-width="4" stroke-opacity="0.3"/>
</svg>
