<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ui-check</title>
  <style>body{font:14px monospace;background:#0b1020;color:#dfe7ff;padding:16px}</style>
</head>
<body>
<iframe id="game" src="../index.html" style="width:390px;height:780px;border:1px solid #444"></iframe>
<pre id="out">загрузка…</pre>
<script type="module">
// Разбор интерфейса в настоящем браузере: раскрытие хроники,
// порядок действий, отсутствие лимита населения.
const log = [];
const say = (text) => { log.push(text); document.getElementById('out').textContent = log.join('\n'); };
let failed = false;
const check = (ok, label, detail = '') => {
  if (!ok) failed = true;
  say(`${ok ? 'ok  ' : 'FAIL'} ${label}${detail ? ' — ' + detail : ''}`);
};

const frame = document.getElementById('game');

try {
  await new Promise((resolve) => {
    frame.addEventListener('load', resolve, { once: true });
    if (frame.contentDocument?.readyState === 'complete') resolve();
  });
  await new Promise((r) => setTimeout(r, 600));

  const doc = frame.contentDocument;
  const app = frame.contentWindow.app;

  check(Boolean(app), 'игра запустилась');
  check(!doc.querySelector('.fatal-error'), 'нет фатальной ошибки');
  check(doc.querySelector('#chip-build')?.textContent?.length > 0,
        'видна метка сборки', doc.querySelector('#chip-build')?.textContent ?? '');

  // -- Показатели ---------------------------------------------------------
  const meters = [...doc.querySelectorAll('.meter')].map((n) => n.textContent.replace(/\s+/g, ' ').trim());
  check(meters.length === 3, 'показателей ровно три', meters.join(' | '));
  check(/Население/.test(meters[0]), 'есть население', meters[0]);
  check(!/рабочие/i.test(doc.querySelector('#meters').textContent) || /работают/.test(meters[0]),
        'занятость внутри карточки населения', meters[0]);
  check(!/\/\s*\d+/.test(meters[0]), 'лимита населения не видно', meters[0]);
  check(/работают|свободн|не работает/.test(meters[0]), 'видно, сколько работает', meters[0]);

  // Счастье — уровень словами, а не проценты: «80%» вводит в заблуждение,
  // потому что уровень не измеряется ни в чём.
  check(/Счастье/.test(meters[1]) && !/%/.test(meters[1]),
        'счастье показано уровнем, не процентом', meters[1]);
  check(/Налог/.test(meters[2]) && /%/.test(meters[2]),
        'ставка налога видна вместе с подписью', meters[2]);

  // -- Одинаковая высота карточек ----------------------------------------
  const cards = [...doc.querySelectorAll('.meter, .res')];
  const boxes = cards.map((n) => ({
    cls: n.className.replace('meter--', 'meter.').replace('res--', 'res.'),
    h: Math.round(n.getBoundingClientRect().height),
    w: Math.round(n.getBoundingClientRect().width),
  }));
  const unique = [...new Set(boxes.map((b) => b.h))];
  check(unique.length === 1, 'высота карточек одинакова',
        `высоты: ${unique.join(', ')} | ${boxes.map((b) => `${b.cls}=${b.h}`).join(', ')}`);

  // -- Ресурсы в одну строку ----------------------------------------------
  const cards2 = [...doc.querySelectorAll('.res')];
  check(cards2.length === 6, 'ресурсов шесть', String(cards2.length));

  const tops = [...new Set(cards2.map((n) => Math.round(n.getBoundingClientRect().top)))];
  check(tops.length === 1, 'ресурсы в одну строку', `строк: ${tops.length}`);

  const widest = Math.max(...cards2.map((n) => n.getBoundingClientRect().right));
  const box = doc.querySelector('.resources').getBoundingClientRect();
  check(widest <= box.right + 1, 'ресурсы не вылезают за полосу',
        `${Math.round(widest)} / ${Math.round(box.right)}`);
  check(box.height < 90, 'полоса ресурсов низкая', `${Math.round(box.height)}px`);

  // -- Прогресс к следующему уровню ---------------------------------------
  //
  // Порядок карточек совпадает с BALANCE.resourceOrder. Цель есть только
  // у ресурсов, которые нужны для перехода: дерево, камень и еда.
  const ORDER = ['gold', 'food', 'wood', 'stone', 'faith', 'knowledge'];
  const WITH_GOAL = new Set(['food', 'wood', 'stone']);
  const goals = cards2.map((n, i) => ({
    key: ORDER[i],
    text: n.querySelector('.res__goal')?.textContent ?? '',
    barHidden: n.querySelector('.res__bar')?.hidden !== false,
    fill: n.querySelector('.res__bar-fill')?.style.width ?? '',
  }));

  for (const goal of goals) {
    if (WITH_GOAL.has(goal.key)) {
      check(/^\d+\/\d+$/.test(goal.text), `${goal.key}: видно «собрано из целевого»`,
            goal.text || 'пусто');
      check(!goal.barHidden, `${goal.key}: полоса прогресса показана`);
    } else {
      check(goal.text === '' && goal.barHidden,
            `${goal.key}: без цели, лишних подписей нет`,
            `${goal.text}, полоса скрыта: ${goal.barHidden}`);
    }
  }
  check(goals.filter((g) => g.fill).length === WITH_GOAL.size,
        'полосы заполнены только у ресурсов с целью',
        goals.map((g) => `${g.key}=${g.fill}`).join(' '));

  // -- Две части: верх прижат к верху, низ — к низу -----------------------
  const order = [...doc.querySelectorAll('#ui-overlay > *')].map((n) => n.className.split(' ')[0]);
  check(order.join(' → ') === 'top-bar → meters → resources → chronicle-panel → choices-panel',
        'порядок секций', order.join(' → '));

  const top = doc.querySelector('#ui-overlay').getBoundingClientRect();
  const bar = doc.querySelector('.top-bar').getBoundingClientRect();
  const metersBox = doc.querySelector('.meters').getBoundingClientRect();
  const resBox = doc.querySelector('.resources').getBoundingClientRect();
  const chronBox = doc.querySelector('.chronicle-panel').getBoundingClientRect();
  const choiceBox = doc.querySelector('.choices-panel').getBoundingClientRect();

  // Верхняя часть: плашка, показатели, ресурсы — сверху вниз, без зазоров
  check(bar.top - top.top < 16, 'плашка прижата к верху', `${Math.round(bar.top - top.top)}px`);
  check(metersBox.top > bar.bottom, 'показатели под плашкой');
  check(resBox.top > metersBox.bottom, 'ресурсы под показателями');

  // Нижняя часть: хроника, затем выборы у самого низа
  check(chronBox.top > resBox.bottom, 'хроника ниже ресурсов');
  check(choiceBox.top > chronBox.bottom - 1, 'выборы под хроникой');

  const slackBottom = frame.contentWindow.innerHeight - choiceBox.bottom;
  check(Math.abs(slackBottom) < 24, 'выборы прижаты к низу экрана',
        `${Math.round(slackBottom)}px снизу`);

  // Свободное место должно быть между ресурсами и хроникой — там виден
  // город. Между хроникой и выборами зазора быть не должно: это нижняя
  // часть экрана, она прижата к краю целиком.
  const topGap = bar.top - top.top;
  const bottomGap = frame.contentWindow.innerHeight - choiceBox.bottom;
  const cityGap = chronBox.top - resBox.bottom;
  const innerGap = choiceBox.top - chronBox.bottom;

  check(topGap < 16, 'сверху нет пустоты', `${Math.round(topGap)}px`);
  check(bottomGap < 24, 'снизу нет пустоты', `${Math.round(bottomGap)}px`);
  check(innerGap < 16, 'хроника и выборы стоят впритык', `${Math.round(innerGap)}px`);
  check(cityGap >= innerGap, 'свободное место выше хроники',
        `под ресурсами ${Math.round(cityGap)}px, между хроникой и выборами ${Math.round(innerGap)}px`);

  // -- Порядок действий ---------------------------------------------------
  const buttons = [...doc.querySelectorAll('.choice')].filter((n) => !n.hidden);
  const labels = buttons.map((n) => n.querySelector('.choice__text').textContent);
  check(buttons.length === 4, 'действий четыре', String(buttons.length));
  check(labels.at(-1) === 'Подождать', '«Подождать» последний', labels.join(' | '));
  check(labels.slice(0, 3).every((l) => l !== 'Подождать'), '«Подождать» только один раз');

  const widths = buttons.map((n) => Math.round(n.getBoundingClientRect().width));
  check(new Set(widths).size === 1, 'кнопки одной ширины', widths.join(', '));

  // -- Хроника ------------------------------------------------------------
  const panel = doc.querySelector('.chronicle-panel');
  const list = doc.querySelector('#chronicle');
  const toggle = doc.querySelector('#chronicle-toggle');
  check(!panel.classList.contains('is-open'), 'хроника свёрнута по умолчанию');
  check(toggle.getAttribute('aria-expanded') === 'false', 'состояние кнопки верное');

  // Играем ходы, чтобы наполнить хронику.
  //
  // Первый ход — постройка, остальные «Подождать»: кликать всегда
  // первую кнопку бессмысленно, как только ресурсов на неё не хватает,
  // день не сдвинется и хроника останется пустой.
  for (let i = 0; i < 12; i += 1) {
    const enabled = [...doc.querySelectorAll('.choice')].filter((n) => !n.disabled && !n.hidden);
    if (!enabled.length) break;
    (i === 0 ? enabled[0] : enabled.at(-1)).click();
    await new Promise((r) => setTimeout(r, 60));
  }
  await new Promise((r) => setTimeout(r, 200));

  const collapsedCount = list.querySelectorAll('.chronicle__item').length;
  check(collapsedCount === 2, 'свёрнуто видны две записи', String(collapsedCount));
  const collapsedHeight = Math.round(panel.getBoundingClientRect().height);
  check(collapsedHeight < 200, 'свёрнутая панель компактна', collapsedHeight + 'px');

  toggle.click();
  await new Promise((r) => setTimeout(r, 250));
  check(panel.classList.contains('is-open'), 'хроника раскрылась');
  check(toggle.getAttribute('aria-expanded') === 'true', 'состояние кнопки обновилось');
  const openCount = list.querySelectorAll('.chronicle__item').length;
  check(openCount > collapsedCount, 'появились более ранние записи', `${collapsedCount} → ${openCount}`);
  const openHeight = Math.round(panel.getBoundingClientRect().height);
  check(openHeight > collapsedHeight, 'панель выросла', `${collapsedHeight} → ${openHeight}`);

  // Даже развёрнутая хроника не должна вытеснить выборы за экран
  const expandedChoices = doc.querySelector('.choices-panel').getBoundingClientRect();
  const expandedViewport = frame.contentWindow.innerHeight;
  check(expandedChoices.bottom <= expandedViewport + 1,
        'выборы остались на экране при раскрытой хронике',
        `${Math.round(expandedChoices.bottom)} / ${expandedViewport}`);

  toggle.click();
  await new Promise((r) => setTimeout(r, 250));
  check(!panel.classList.contains('is-open'), 'хроника свернулась обратно');
  check(list.querySelectorAll('.chronicle__item').length === 2, 'снова две записи');

  // -- Лимита населения нет в состоянии ----------------------------------
  const resources = app.session.state.data.resources;
  check(resources.population > 0, 'население положительное', String(resources.population));

  document.title = failed ? 'FAILED' : `PASS ${log.length}`;
} catch (error) {
  check(false, 'исключение', `${error.name}: ${error.message}`);
  check(false, 'стек', (error.stack ?? '').split('\n').slice(1, 3).join(' | '));
  document.title = failed ? 'FAILED' : `PASS ${log.length}`;
}
</script>
</body>
</html>
